<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel United International Co., Ltd.</title>
    <meta name="description" content="Excel United International Co., Ltd. (EUI) is a premier foreign export-import and FMCG distribution enterprise headquartered in Bangkok with nationwide reach in Myanmar." />
    
    <!-- Rounded Square Favicon using SVG wrapper -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F6EB14'/%3E%3Cimage href='https://uploads.onecompiler.io/43924vdyc/442298qsn/logo.png' x='6' y='6' width='88' height='88' preserveAspectRatio='xMidYMid meet'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="https://uploads.onecompiler.io/43924vdyc/442298qsn/logo.png" />

    <!-- Preload critical assets for LCP optimization -->
    <link rel="preload" href="https://uploads.onecompiler.io/43924vdyc/442298qsn/logo.png" as="image" type="image/png" />
    <link rel="preload" href="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80" as="image" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Excel United International Co., Ltd." />
    <meta property="og:description" content="Excel United International Co., Ltd. (EUI) specializes in FMCG import, export, and nationwide retail and wholesale distribution across Southeast Asia." />
    <meta property="og:image" content="https://uploads.onecompiler.io/43924vdyc/442298qsn/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Excel United International Co., Ltd." />
    <meta name="twitter:description" content="Premier FMCG import, export, and nationwide distribution leader in Myanmar and Thailand." />
    <meta name="twitter:image" content="https://uploads.onecompiler.io/43924vdyc/442298qsn/logo.png" />

    <!-- Modern 2026 Typography: Plus Jakarta Sans, Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Default light mode initialization script -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('eui_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-rose-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
