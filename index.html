    <meta charset="UTF-8" />

    <title>Excel United International Co., Ltd.</title>
    <meta name="description" content="Excel United International Co., Ltd. (EUI) is a premier foreign export-import and FMCG distribution enterprise headquartered in Bangkok with nationwide reach in Myanmar." />

    <!-- Safe fetch property handler: prevents Uncaught TypeError when scripts/extensions attempt to reassign window.fetch -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;

          function defineFetchProperty(obj) {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
                get: function() {
                  return activeFetch || originalFetch;
                },
                set: function(newFetch) {
                  activeFetch = typeof newFetch === 'function' ? newFetch : activeFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }

          defineFetchProperty(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetchProperty(Window.prototype);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            defineFetchProperty(globalThis);
          }
        } catch (_) {}

        // Global error trap for any getter-only fetch property assignment attempts
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="https://uploads.onecompiler.io/43924vdyc/442298qsn/logo.png" />
    <link rel="apple-touch-icon" href="https://uploads.onecompiler.io/43924vdyc/442298qsn/logo.png" />

    <link rel="preload" href="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80" as="image" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Excel United International Co., Ltd." />
    <meta property="og:description" content="Excel United International Co., Ltd. (EUI) specializes in FMCG import, export, and nationwide retail and wholesale distribution across Southeast Asia." />
    <meta property="og:image" content="https://uploads.onecompiler.io/43924vdyc/442298qsn/logo.png" />

    <!-- Default light mode initialization script -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('eui_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>

  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-rose-600 selection:text-white">
